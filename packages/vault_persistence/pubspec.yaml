name: vault_persistence
description: >-
  Drift database, DAOs, migrations, and repository implementations for the
  dokki vault. The whole database file is SQLCipher-encrypted.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
resolution: workspace

dependencies:
  convert: ^3.1.2
  drift: '>=2.28.0 <2.32.0'
  meta: ^1.17.0
  path: ^1.9.1
  sqlcipher_flutter_libs: ^0.6.8
  sqlite3: ^2.9.1
  vault_crypto:
    path: ../vault_crypto
  vault_domain:
    path: ../vault_domain

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: '>=2.28.0 <2.32.0'
  test: ^1.26.3
